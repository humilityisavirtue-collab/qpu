[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qpu"
version = "0.1.0"
description = "Quaternary Processing Unit — GF(4) co-processor accelerator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Patrick Moore", email = "humilityisavirtue@gmail.com" },
]
keywords = ["quaternary", "gf4", "galois-field", "accelerator", "co-processor", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
all = ["torch>=2.0"]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/humilityisavirtue-collab/qpu"
Repository = "https://github.com/humilityisavirtue-collab/qpu"

[project.scripts]
qpu = "qpu.cli:main"

[tool.hatch.build.targets.sdist]
include = ["src/qpu", "tests", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/qpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
